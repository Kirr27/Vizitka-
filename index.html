<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fedchenko Kirylo</title>
    <style>
        body {
            font-family: system-ui, -apple-system, sans-serif;
            background-color: #f0f2f5;

            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            padding: 20px;
            box-sizing: border-box;
        }
        .card {
            background: #ffffff;
            padding: 30px 25px;
            border-radius: 16px;

            text-align: center;
            width: 100%;
            max-width: 360px;
        }
        h1 {
            margin: 0 0 8px 0;
            font-size: 24px;
            color: #1a1a1a;
        }
        p {
            margin: 0 0 24px 0;
            color: #666666;
            font-size: 16px;
        }
        .btn {
            display: block;
            margin-top: 12px;
            padding: 14px;
            border-radius: 10px;
            text-decoration: none;
            font-weight: 600;
            font-size: 15px;
            transition: opacity 0.2s;
            color: white;
        }
        .btn:active {
            opacity: 0.8;
        }
        .telegram { background-color: #0088cc; }
        .whatsapp { background-color: #25d366; }
        .email { background-color: #4a5568; }
